name: Ticketlink Playwright Test

on:
  workflow_dispatch:
  schedule:
    # 30분마다 자동 실행 (GitHub cron은 UTC 기준)
    - cron: "7,37 * * * *"

permissions:
  contents: write

jobs:
  collect-ticketlink:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Collect Ticketlink games
        run: |
          python fetch_ticketlink.py

      - name: Upload debug files on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ticketlink-debug
          path: debug_ticketlink/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated Ticketlink data
        if: success()
        run: |
          if git diff --quiet -- ticketlink_games.json; then
            echo "No changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ticketlink_games.json
          git commit -m "Update Ticketlink games"
          git push
