<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KBO 경기 / 예매 일정</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f3f4f6;color:#111827;font-family:Arial,"Malgun Gothic",sans-serif}
  .wrap{max-width:1600px;margin:auto;padding:24px}
  h1{margin:0;font-size:28px}
  .sub{margin-top:7px;color:#6b7280;line-height:1.55}
  .topline{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .view-switch{display:flex;gap:6px;background:#fff;padding:5px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
  .view-switch button{border:0;background:transparent;padding:8px 11px;border-radius:7px;cursor:pointer;font-weight:800;color:#6b7280}
  .view-switch button.active{background:#111827;color:#fff}
  .toolbar{margin-top:20px;background:#fff;padding:14px;border-radius:12px;display:flex;gap:10px;flex-wrap:wrap;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  select,input,button{padding:9px 12px;border:1px solid #d1d5db;border-radius:8px;background:#fff;font:inherit}
  button{cursor:pointer;font-weight:700}
  input{min-width:220px}
  .tablebox{margin-top:14px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .scroll{overflow:auto}
  table{width:100%;border-collapse:collapse;min-width:1150px}
  thead{background:#111827;color:white}
  th,td{padding:12px;text-align:left}
  th.sort{cursor:pointer}
  tr{border-top:1px solid #e5e7eb}
  tr.today{background:#fff3a3}
  .home{font-weight:800}
  .status{font-weight:800}
  a{color:#4f46e5;text-decoration:none}
  .err{margin-top:20px;padding:14px;background:#fee2e2;border-radius:10px;color:#991b1b}

  /* 모바일 목록형 */
  .mobile-list{display:none;margin-top:14px}
  .mobile-count{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;color:#6b7280;font-size:14px}
  .today-count{font-weight:900;color:#ef4444}
  .game-card{
    background:#fff;border:1px solid #e5e7eb;border-radius:14px;
    margin-bottom:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.04)
  }
  .game-card.today{background:#fff3a3;border-color:#edd978}
  .card-main{padding:14px}
  .card-open{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .open-text{font-size:15px;font-weight:900}
  .today-badge{font-size:12px;font-weight:900;color:#ef4444;background:#fff;border-radius:999px;padding:5px 8px}
  .match-row{display:flex;align-items:center;gap:10px}
  .date-box{min-width:112px;padding-right:10px;border-right:1px solid #e5e7eb}
  .game-date{font-weight:900;line-height:1.45}
  .game-time{font-size:19px;font-weight:900;margin-top:2px}
  .match-info{flex:1;min-width:0}
  .teams{font-size:17px;font-weight:900;line-height:1.45}
  .venue{margin-top:6px;color:#6b7280;font-size:14px}
  .card-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
  .badges{display:flex;gap:6px;flex-wrap:wrap}
  .badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;background:#eef2ff;color:#3730a3}
  .badge.status-badge{background:#f3f4f6;color:#374151}
  .game-card.today .badge.status-badge{background:#fff7cc}
  .open-link{font-weight:900;color:#2563eb;white-space:nowrap}
  .empty{padding:30px;text-align:center;color:#6b7280;background:#fff;border-radius:12px}

  body.view-mobile .tablebox{display:none}
  body.view-mobile .mobile-list{display:block}
  body.view-pc .tablebox{display:block}
  body.view-pc .mobile-list{display:none}

  @media (max-width: 768px){
    .wrap{padding:18px 14px}
    h1{font-size:29px;line-height:1.2}
    .sub{font-size:15px}
    .topline{display:block}
    .view-switch{margin-top:14px;width:max-content}
    .toolbar{padding:12px;gap:8px}
    .toolbar select{width:calc(50% - 4px)}
    .toolbar input{width:100%;min-width:0}
    .toolbar #reload{width:100%}
    select,input,button{font-size:15px;padding:11px}
    .date-box{min-width:105px}
    .teams{font-size:16px}
  }

  @media (max-width: 430px){
    .wrap{padding:16px 10px}
    h1{font-size:28px}
    .toolbar select{width:calc(50% - 4px);font-size:14px;padding:10px 8px}
    .match-row{align-items:flex-start}
    .date-box{min-width:98px}
    .game-date{font-size:14px}
    .game-time{font-size:18px}
    .teams{font-size:15px}
    .venue{font-size:13px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topline">
    <div>
      <h1>KBO 경기 / 예매 일정</h1>
      <div id="summary" class="sub">데이터 불러오는 중...</div>
    </div>
    <div class="view-switch" aria-label="보기 방식">
      <button id="mobileViewBtn" type="button">모바일 보기</button>
      <button id="pcViewBtn" type="button">PC 보기</button>
    </div>
  </div>

  <div class="toolbar">
    <select id="team"><option value="">전체 구단</option></select>
    <select id="site">
      <option value="">전체 예매처</option>
      <option value="티켓링크">티켓링크</option>
      <option value="NOL 티켓">NOL 티켓</option>
    </select>
    <select id="status">
      <option value="">전체 예매상태</option>
      <option value="예매중">예매중</option>
      <option value="예매예정">예매예정</option>
      <option value="확인 필요">확인 필요</option>
    </select>
    <select id="sort">
      <option value="openDate">예매예정일 빠른순</option>
      <option value="gameDate">경기일 빠른순</option>
      <option value="team">홈팀순</option>
      <option value="site">예매처순</option>
      <option value="status">예매상태순</option>
    </select>
    <input id="search" placeholder="팀명 / 경기장 검색">
    <button id="reload">최신 파일 다시 읽기</button>
  </div>

  <!-- PC 표 -->
  <div class="tablebox">
    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th class="sort" data-sort="openDate">예매예정날짜 ↕</th>
            <th class="sort" data-sort="gameDate">경기일시 ↕</th>
            <th>경기장</th>
            <th class="sort" data-sort="team">홈팀 ↕</th>
            <th>원정팀</th>
            <th class="sort" data-sort="status">예매상태 ↕</th>
            <th class="sort" data-sort="site">예매처 ↕</th>
            <th>바로가기</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- 모바일 목록 -->
  <div id="mobileList" class="mobile-list">
    <div class="mobile-count">
      <span id="todayCount" class="today-count"></span>
      <span id="visibleCount"></span>
    </div>
    <div id="cards"></div>
  </div>

  <div id="error"></div>
</div>

<script>
let DATA = [];
let META = {};
let sortDirection = 1;

const $ = id => document.getElementById(id);

function openSortValue(g){
  const m = String(g.openDate || '').match(/(\d{4})[.\-/](\d{2})[.\-/](\d{2}).*?(\d{2}):(\d{2})/);
  return m ? `${m[1]}-${m[2]}-${m[3]} ${m[4]}:${m[5]}` : '9999-99-99 99:99';
}

function compare(mode,a,b){
  let av='', bv='';
  if(mode==='gameDate'){ av=`${a.date} ${a.time}`; bv=`${b.date} ${b.time}`; }
  else if(mode==='openDate'){ av=openSortValue(a); bv=openSortValue(b); }
  else if(mode==='team'){ av=a.homeTeam||''; bv=b.homeTeam||''; }
  else if(mode==='site'){ av=a.platformName||''; bv=b.platformName||''; }
  else if(mode==='status'){ av=a.status||''; bv=b.status||''; }

  const primary = av.localeCompare(bv,'ko') * sortDirection;
  if(primary===0 && mode==='openDate'){
    return (`${a.date} ${a.time}`).localeCompare(`${b.date} ${b.time}`,'ko');
  }
  return primary;
}

function filteredRows(){
  const tf=$('team').value;
  const sf=$('site').value;
  const st=$('status').value;
  const q=$('search').value.trim().toLowerCase();
  const mode=$('sort').value;

  let rows = DATA.filter(g=>{
    if(tf && g.homeTeam!==tf && g.awayTeam!==tf) return false;
    if(sf && g.platformName!==sf) return false;
    if(st && g.status!==st) return false;
    if(q){
      const hay=`${g.homeTeam} ${g.awayTeam} ${g.place} ${g.platformName}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  return [...rows].sort((a,b)=>compare(mode,a,b));
}

function formatGameDate(date){
  const m=String(date||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return date||'-';
  const d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));
  const days=['일','월','화','수','목','금','토'];
  return `${m[1]}.${m[2]}.${m[3]}(${days[d.getDay()]})`;
}

function draw(){
  const rows=filteredRows();

  const tl=DATA.filter(g=>g.platform==='ticketlink').length;
  const nol=DATA.filter(g=>g.platform==='nol').length;

  $('summary').textContent =
    `마지막 업데이트: ${META.updatedAtLocal || META.updatedAt || '-'} · 전체 ${DATA.length}경기 · 티켓링크 ${tl} · NOL ${nol} · 현재 표시 ${rows.length}경기`;

  $('tbody').innerHTML = rows.map(g=>{
    const cls=g.isTodayOpen?'today':'';
    const open=g.isTodayOpen?`🔥 ${g.openDate||'오늘 오픈'}`:(g.openDate||'-');
    return `<tr class="${cls}">
      <td style="font-weight:${g.isTodayOpen?'900':'700'};white-space:nowrap">${open}</td>
      <td style="white-space:nowrap">${g.date} ${g.time||''}</td>
      <td>${g.place||'-'}</td>
      <td class="home">${g.homeTeam||'-'}</td>
      <td>${g.awayTeam||'-'}</td>
      <td class="status">${g.status||'-'}</td>
      <td>${g.platformName||'-'}</td>
      <td><a href="${g.pageUrl}" target="_blank" rel="noopener noreferrer">열기</a></td>
    </tr>`;
  }).join('');

  const todayRows=rows.filter(g=>g.isTodayOpen);
  $('todayCount').textContent = todayRows.length ? `🔥 오늘 예매오픈 ${todayRows.length}건` : '';
  $('visibleCount').textContent = `총 ${rows.length}경기`;

  $('cards').innerHTML = rows.length ? rows.map(g=>{
    const open = g.isTodayOpen
      ? `🔥 ${g.openDate || '오늘 오픈'}`
      : (g.openDate || '예매일 미정');

    return `<article class="game-card ${g.isTodayOpen?'today':''}">
      <div class="card-main">
        <div class="card-open">
          <div class="open-text">${open}</div>
          ${g.isTodayOpen?'<span class="today-badge">오늘 오픈</span>':''}
        </div>

        <div class="match-row">
          <div class="date-box">
            <div class="game-date">${formatGameDate(g.date)}</div>
            <div class="game-time">${g.time||'-'}</div>
          </div>

          <div class="match-info">
            <div class="teams">${g.homeTeam||'-'} <span style="color:#9ca3af;font-weight:700">vs</span> ${g.awayTeam||'-'}</div>
            <div class="venue">📍 ${g.place||'-'}</div>

            <div class="card-bottom">
              <div class="badges">
                <span class="badge">${g.platformName||'-'}</span>
                <span class="badge status-badge">${g.status||'-'}</span>
              </div>
              <a class="open-link" href="${g.pageUrl}" target="_blank" rel="noopener noreferrer">열기 ›</a>
            </div>
          </div>
        </div>
      </div>
    </article>`;
  }).join('') : '<div class="empty">조건에 맞는 경기가 없습니다.</div>';
}

function setView(mode, save=true){
  document.body.classList.remove('view-mobile','view-pc');
  document.body.classList.add(mode==='mobile'?'view-mobile':'view-pc');
  $('mobileViewBtn').classList.toggle('active',mode==='mobile');
  $('pcViewBtn').classList.toggle('active',mode==='pc');
  if(save) localStorage.setItem('kboViewMode',mode);
}

function initialView(){
  const saved=localStorage.getItem('kboViewMode');
  if(saved==='mobile' || saved==='pc'){
    setView(saved,false);
    return;
  }
  setView(window.matchMedia('(max-width: 768px)').matches?'mobile':'pc',false);
}

async function load(){
  $('error').innerHTML='';
  try{
    const r=await fetch(`kbo_live.json?t=${Date.now()}`,{cache:'no-store'});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const j=await r.json();
    META=j;
    DATA=Array.isArray(j.events)?j.events:[];
    const teams=[...new Set(DATA.flatMap(g=>[g.homeTeam,g.awayTeam]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
    $('team').innerHTML='<option value="">전체 구단</option>'+teams.map(t=>`<option value="${t}">${t}</option>`).join('');
    draw();
  }catch(e){
    $('error').innerHTML=`<div class="err">kbo_live.json을 읽지 못했습니다: ${e}</div>`;
    $('summary').textContent='데이터 없음';
  }
}

['team','site','status','sort'].forEach(id=>$(id).addEventListener('change',draw));
$('search').addEventListener('input',draw);
$('reload').onclick=load;

document.querySelectorAll('th[data-sort]').forEach(th=>{
  th.onclick=()=>{
    const mode=th.dataset.sort;
    if($('sort').value===mode) sortDirection*=-1;
    else{ $('sort').value=mode; sortDirection=1; }
    draw();
  };
});

$('mobileViewBtn').onclick=()=>setView('mobile');
$('pcViewBtn').onclick=()=>setView('pc');

initialView();
load();
</script>
</body>
</html>
